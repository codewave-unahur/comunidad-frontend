services:
  frontend:
    container_name: bolsa-front
    restart: unless-stopped
    image: bolsa-front:v1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${VITE_PORT}:80"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - api_network
      
networks:
  api_network:
      driver: bridge
      